name: Supabase Keep-Alive Ping

on:
  schedule:
    # Berjalan setiap 3 hari pada pukul 07:00 UTC (14:00 WIB)
    # Cukup untuk mencegah auto-pause Supabase (batas pause adalah 7 hari tidak aktif)
    - cron: '0 7 */3 * *'
  workflow_dispatch: # Memungkinkan tombol "Run workflow" secara manual dari GitHub Actions

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database Endpoint
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://wunwvwxokxxmlvyfscdj.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind1bnd2d3hva3h4bWx2eWZzY2RqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA1MDQwMjYsImV4cCI6MjEwNjA4MDAyNn0.YD53sgd_l48rK_2qnXGGC34FHczQCyP0XN53ARM5lCs' }}
        run: |
          echo "Sending keep-alive ping to Supabase..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/locations?select=id&limit=1")
          
          echo "Response HTTP Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "✅ Ping berhasil! Supabase database tetap aktif."
          else
            echo "⚠️ Ping gagal atau mengembalikan status code $HTTP_STATUS."
            exit 1
          fi
